<template id="t-about">
  <p class="kicker" data-i18n="about.kicker">About</p>
  <h2 data-i18n="about.title">About us…</h2>
  <div class="prose">
    <div class="stanza">
      <p data-i18n="about.p1_1">고개를 높이 들어야 보이는</p>
      <p data-i18n="about.p1_2">좁은 삼각형 건물의 꼭대기 6층.</p>
      <p data-i18n="about.p1_3">처음 이 공간을 마주했을 때,</p>
      <p data-i18n="about.p1_4">도심의 소음에서 멀찍이 떨어져</p>
      <p data-i18n="about.p1_5">높은 곳에 자리를 잡은 ‘산새의 둥지’같다는 생각을 했습니다.</p>
    </div>
    <div class="stanza">
      <p data-i18n="about.p2_1">산새의 둥지, 그 둥지 속의 <strong>산새</strong>.</p>
      <p data-i18n="about.p2_2">커피 <code>coffee</code> 를 포함한 음료와 쿠키 <code>cookie</code> 로 시작했기에</p>
      <p data-i18n="about.p2_3">공통된 알파벳인 <strong>코에</strong> <code>coe</code> 를 붙였고,</p>
      <p data-i18n="about.p2_4">이는 일본어로 ‘소리(こえ)’라는 뜻을 가지고 있기도 합니다.</p>
      <p data-i18n="about.p2_5">실제로 이 곳에선 새들의 소리가 가깝게 들리기도 하고,</p>
      <p data-i18n="about.p2_6">저희가 고심해 고른 배경 음악 속에서도 새들의 지저귐이 섞여 나옵니다.</p>
    </div>
    <div class="stanza">
      <p data-i18n="about.p3_1">영어로 적어 본 <code>sansaecoe</code> 는</p>
      <p data-i18n="about.p3_2">가만히 들여다보면,</p>
      <p data-i18n="about.p3_3">어느 하나 툭 튀어나온 것 없이 물 흐르듯 매끄러운 모양입니다.</p>
      <p data-i18n="about.p3_4">이 모양처럼, 이곳에서만큼은</p>
      <p data-i18n="about.p3_5">편안한 소리와 조화로운 맛을 느끼며</p>
      <p data-i18n="about.p3_6">부드러운 시간을 보내시길 바랍니다.</p>
    </div>
  </div>
  <figure>
    <img src="assets/about-night.jpg" width="1187" height="1780" loading="lazy"
         alt="따뜻한 빛이 내려앉은 산새코에의 밤 — 천장 조명과 나무 기둥" data-i18n-alt="about.alt">
  </figure>
</template>

<template id="t-hiyiko">
  <p class="kicker" data-i18n="hiyiko.kicker">[sansaecoe] Hiyiko Cup Story</p>
  <h2 data-i18n="hiyiko.title">후쿠이 히요코 잔</h2>

  <figure class="photo">
    <img class="full" src="assets/hukui-1.jpg" width="2048" height="1365" loading="lazy"
         alt="풀밭에 무리 지어 피어난 흰 봄꽃" data-i18n-alt="hiyiko.alt1">
  </figure>

  <div class="prose prose--lead">
    <div class="stanza">
      <p data-i18n="hiyiko.lead">사물에 마음이 깃들 수 있을까요.</p>
    </div>
    <div class="stanza">
      <p data-i18n="hiyiko.p1">병아리잔 하나로 이어진 실타래를 잡고 닿은 곳은 코우지 작가님 부부의 작업실이었습니다.</p>
      <p data-i18n="hiyiko.p2">후쿠이에서 나고 자란 소년은 고향 땅에 머물렀기에 이곳의 붉은 점토를 만지는 사람이 될 수 있었다고 말합니다.</p>
      <p data-i18n="hiyiko.p3">뜨거운 가마 속에서 거친 흙이 단단해지는 동안, 작가님은 잔의 곡선을 아주 조금씩 더 다정하게 다듬어 나갔습니다.</p>
      <p data-i18n="hiyiko.p4">그렇게 20년이라는 시간이 이 작은 잔의 곡선 위에 쌓였습니다.</p>
      <p data-i18n="hiyiko.p5">좁은 계단을 올라 마주한 다락방의 빼곡한 병아리잔들 사이로 한 사람이 묵묵히 지켜온 시간이 가만히 고여 있었습니다.</p>
    </div>
  </div>

  <figure class="photo">
    <img class="full" src="assets/hukui-2.jpg" width="2048" height="1365" loading="lazy"
         alt="초록 잎 사이로 고개를 숙인 흰 꽃송이들" data-i18n-alt="hiyiko.alt2">
  </figure>

  <div class="prose">
    <div class="stanza">
      <p data-i18n="hiyiko.q">좋은 사물에 둘러싸여 살아가는 매일매일의 삶은 우리를 더 나은 곳으로 이끌어줄 수 있을까요.</p>
    </div>
  </div>

  <div class="prose prose--breath">
    <div class="stanza">
      <p data-i18n="hiyiko.b1">준비해 간 쿠키와 차로 마음을 전하고, 건네주신 하부타에 모찌를 품에 안고 돌아오는 길.</p>
      <p data-i18n="hiyiko.b2">발치에 닿은 맨홀에는 두마리의 새가 새겨져 있었습니다.</p>
      <p data-i18n="hiyiko.b3">여러 차례의 역경을 이겨낸 이 도시의 상징, 불사조라고 합니다.</p>
      <p data-i18n="hiyiko.b4">새에 담긴 마음을 모아온 우리의 여정이 낯선 길 위에서도 이어진 것 같아 참 반가웠습니다.</p>
    </div>
  </div>
  <figure class="phoenix">
    <a class="fig-link" href="https://www.instagram.com/p/DXIe9bmj5df/?obrf=ZDNkOW4zMnVjenJh"
       target="_blank" rel="noopener noreferrer">
      <img src="assets/phoenix.gif" width="480" height="360" loading="lazy"
           alt="검은 바탕에 귀와 새가 그려지며 ‘A LITTLE BIRDIE TOLD ME’라고 적히는 움직이는 그림" data-i18n-alt="hiyiko.gifAlt">
      <span class="fig-cap" data-i18n="hiyiko.figcap">후쿠이의 불사조 맨홀이 궁금하면 클릭!</span>
    </a>
  </figure>
  <figure class="order">
    <a class="cup-link" href="https://docs.google.com/forms/d/e/1FAIpQLSeknSGQxWfjR5iD-x4sie4q4XCiZseJlDGxMNcZZKh9boSq6g/closedform"
       target="_blank" rel="noopener noreferrer" aria-label="히요코 잔 주문서 열기" data-i18n-aria="hiyiko.orderAria">
      <img src="assets/icon-hukui.png" width="1024" height="670" loading="lazy"
           alt="손잡이가 달린 아이보리빛 병아리잔과 소서" data-i18n-alt="hiyiko.cupAlt">
    </a>
    <p class="order-cta">
      <a class="order-btn" href="https://docs.google.com/forms/d/e/1FAIpQLSeknSGQxWfjR5iD-x4sie4q4XCiZseJlDGxMNcZZKh9boSq6g/closedform"
